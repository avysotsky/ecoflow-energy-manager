[Service]
Environment=ECOFLOW_CONTROL_ENABLED=true
Environment=ECOFLOW_CONTROL_MIN_BACKUP_RESERVE=20
Environment=ECOFLOW_CONTROL_MAX_BACKUP_RESERVE=100
Environment=ECOFLOW_CONTROL_MIN_INTERVAL_MINUTES=60
Environment=ECOFLOW_MANUAL_OVERRIDE_FILE=/home/user/.local/share/ecoflow-energy-manager/manual-override
Environment=ECOFLOW_CONTROL_STATE_PATH=/home/user/.local/share/ecoflow-energy-manager/control-state.json
Environment=ECOFLOW_TELEGRAM_COMMAND=/home/user/.local/libexec/openclaw/telegram-send.sh
Environment=ECOFLOW_TELEGRAM_TIMEOUT_SECONDS=120
